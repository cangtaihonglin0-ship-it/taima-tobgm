<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Header -->
    <header class="w-full bg-slate-900/80 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-black font-extrabold text-lg shadow-lg shadow-cyan-500/20">
                    ♪
                </div>
                <h1 class="text-base md:text-lg font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">
                    BGM &amp; Timer Player
                </h1>
            </div>
            <button id="toggleSettingsBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                ⚙️ <span>音源・音量設定</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1 flex flex-col items-center justify-center">

        <!-- Timer Display Section (Screenshot Replica) -->
        <div class="flex flex-col items-center mb-6 w-full">
            <span id="activeModeTitle" class="text-xs md:text-sm font-semibold tracking-widest text-cyan-400 uppercase bg-cyan-950/60 border border-cyan-800/50 px-4 py-1.5 rounded-full mb-4">
                モードが選択されていません
            </span>

            <!-- Timer Card UI (Matching Screenshot Aspect Ratio & Radius) -->
            <div class="bg-zinc-900/95 border border-zinc-700/60 rounded-[38px] w-48 h-48 sm:w-56 sm:h-56 shadow-2xl flex flex-col items-center justify-center my-2 transition-all duration-300 relative aspect-square">
                <div class="text-slate-200 text-sm sm:text-base font-bold tracking-wide mb-1">
                    Timer
                </div>
                <div id="timeDisplay" class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white font-mono drop-shadow-md">
                    00:00
                </div>
            </div>

            <div id="cycleInfo" class="text-xs md:text-sm text-slate-400 mt-3 h-5 text-center font-medium">
                ボタンを押してモードを選択してください
            </div>
        </div>

        <!-- Mode Buttons 1 - 4 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 w-full max-w-2xl mb-5">
            <button id="btn1" class="mode-btn bg-slate-900 hover:bg-slate-800 border-2 border-slate-700 hover:border-cyan-500 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-200 shadow-lg group active:scale-95">
                <span class="text-2xl font-black text-slate-400 group-hover:text-cyan-400 mb-1">Ⅰ</span>
                <span class="text-xs md:text-sm font-bold text-slate-200">通常ループ A</span>
            </button>

            <button id="btn2" class="mode-btn bg-slate-900 hover:bg-slate-800 border-2 border-slate-700 hover:border-cyan-500 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-200 shadow-lg group active:scale-95">
                <span class="text-2xl font-black text-slate-400 group-hover:text-cyan-400 mb-1">Ⅱ</span>
                <span class="text-xs md:text-sm font-bold text-slate-200">通常ループ B</span>
            </button>

            <button id="btn3" class="mode-btn bg-slate-900 hover:bg-slate-800 border-2 border-slate-700 hover:border-cyan-500 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-200 shadow-lg group active:scale-95">
                <span class="text-2xl font-black text-slate-400 group-hover:text-cyan-400 mb-1">Ⅲ</span>
                <span class="text-xs md:text-sm font-bold text-slate-200">5分 サイクル</span>
                <span class="text-[10px] text-slate-400 mt-1">4分/4分50秒 効果音</span>
            </button>

            <button id="btn4" class="mode-btn bg-slate-900 hover:bg-slate-800 border-2 border-slate-700 hover:border-cyan-500 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-200 shadow-lg group active:scale-95">
                <span class="text-2xl font-black text-slate-400 group-hover:text-cyan-400 mb-1">Ⅳ</span>
                <span class="text-xs md:text-sm font-bold text-slate-200">7分 サイクル</span>
                <span class="text-[10px] text-slate-400 mt-1">6分/6分50秒 効果音</span>
            </button>
        </div>

        <!-- Controls Section (Below Buttons 1-4) -->
        <div class="flex flex-wrap items-center justify-center gap-3 w-full max-w-md">
            <button id="stopBtn" class="bg-rose-900/80 hover:bg-rose-800 text-rose-100 border border-rose-700 font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-sm bg-rose-300"></span> 停止
            </button>
            <button id="resetCycleBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-2">
                🔄 サイクルリセット
            </button>
        </div>

        <!-- Modal Settings Panel (音源・音量設定) -->
        <div id="settingsPanel" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                    <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                        ⚙️ 音量・カスタム音源の設定
                    </h2>
                    <button id="closeSettingsBtn" class="text-slate-400 hover:text-white p-1 text-lg">✕</button>
                </div>

                <!-- Volume Sliders -->
                <div class="mb-6 bg-slate-950/60 border border-slate-800 p-4 rounded-2xl space-y-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🔊 音量調整</h3>
                    
                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span class="text-slate-300">BGM 音量</span>
                            <span id="bgmVolVal" class="text-cyan-400">80%</span>
                        </div>
                        <input type="range" id="bgmVol" min="0" max="1" step="0.01" value="0.8" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span class="text-slate-300">効果音1 音量 (予告)</span>
                            <span id="sfx1VolVal" class="text-cyan-400">100%</span>
                        </div>
                        <input type="range" id="sfx1Vol" min="0" max="1" step="0.01" value="1.0" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span class="text-slate-300">効果音2 音量 (直前)</span>
                            <span id="sfx2VolVal" class="text-cyan-400">100%</span>
                        </div>
                        <input type="range" id="sfx2Vol" min="0" max="1" step="0.01" value="1.0" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                </div>

                <!-- Audio File Inputs -->
                <div class="space-y-3.5 text-xs">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">📁 音源ファイル割り当て</h3>
                    <p class="text-slate-400 text-[11px]">未選択の場合は内蔵の合成音・BGMが使用されます。</p>

                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">ボタンⅠ用 BGM:</label>
                        <input type="file" id="fileBgm1" accept="audio/*" class="w-full text-slate-400 bg-slate-950 border border-slate-800 rounded-xl p-2 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 file:text-xs">
                    </div>

                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">ボタンⅡ・Ⅲ・Ⅳ用 BGM:</label>
                        <input type="file" id="fileBgm2" accept="audio/*" class="w-full text-slate-400 bg-slate-950 border border-slate-800 rounded-xl p-2 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 file:text-xs">
                    </div>

                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">効果音1 (予告音):</label>
                        <input type="file" id="fileSfx1" accept="audio/*" class="w-full text-slate-400 bg-slate-950 border border-slate-800 rounded-xl p-2 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 file:text-xs">
                    </div>

                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">効果音2 (直前音):</label>
                        <input type="file" id="fileSfx2" accept="audio/*" class="w-full text-slate-400 bg-slate-950 border border-slate-800 rounded-xl p-2 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 file:text-xs">
                    </div>
                </div>

                <div class="mt-6 flex justify-end">
                    <button id="saveSettingsBtn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2 px-6 rounded-xl text-xs transition-colors">
                        決定して閉じる
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full py-3 text-center text-slate-600 text-xs border-t border-slate-900">
        BGM &amp; Timer Audio App
    </footer>

    <!-- HTML5 Audio Elements for custom uploads -->
    <audio id="audioBgm1" loop=""></audio>
    <audio id="audioBgm2" loop=""></audio>
    <audio id="audioSfx1"></audio>
    <audio id="audioSfx2"></audio>

    <script>
        // Web Audio Context for synthesized fallback sounds
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Custom audio elements references
        const customAudio = {
            bgm1: document.getElementById('audioBgm1'),
            bgm2: document.getElementById('audioBgm2'),
            sfx1: document.getElementById('audioSfx1'),
            sfx2: document.getElementById('audioSfx2')
        };

        const customFiles = {
            bgm1: null,
            bgm2: null,
            sfx1: null,
            sfx2: null
        };

        // Volume Settings State
        const volumes = {
            bgm: 0.8,
            sfx1: 1.0,
            sfx2: 1.0
        };

        // State Variables
        let currentMode = null; // 1, 2, 3, 4
        let timerInterval = null;
        let timerSeconds = 0; // Elapsed seconds
        let activeBgmElement = null;
        let synthBgmInterval = null;

        // UI Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const activeModeTitle = document.getElementById('activeModeTitle');
        const cycleInfo = document.getElementById('cycleInfo');
        const modeButtons = [
            document.getElementById('btn1'),
            document.getElementById('btn2'),
            document.getElementById('btn3'),
            document.getElementById('btn4')
        ];
        const stopBtn = document.getElementById('stopBtn');
        const resetCycleBtn = document.getElementById('resetCycleBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        // Volume UI Inputs
        const bgmVolInput = document.getElementById('bgmVol');
        const sfx1VolInput = document.getElementById('sfx1Vol');
        const sfx2VolInput = document.getElementById('sfx2Vol');
        const bgmVolVal = document.getElementById('bgmVolVal');
        const sfx1VolVal = document.getElementById('sfx1VolVal');
        const sfx2VolVal = document.getElementById('sfx2VolVal');

        // Setup File Upload Handlers
        function setupFileInput(inputId, type) {
            document.getElementById(inputId).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    customFiles[type] = URL.createObjectURL(file);
                    customAudio[type].src = customFiles[type];
                }
            });
        }

        setupFileInput('fileBgm1', 'bgm1');
        setupFileInput('fileBgm2', 'bgm2');
        setupFileInput('fileSfx1', 'sfx1');
        setupFileInput('fileSfx2', 'sfx2');

        // Settings Panel Toggle
        toggleSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.add('hidden'));
        saveSettingsBtn.addEventListener('click', () => settingsPanel.classList.add('hidden'));

        // Volume Listeners
        bgmVolInput.addEventListener('input', (e) => {
            volumes.bgm = parseFloat(e.target.value);
            bgmVolVal.textContent = Math.round(volumes.bgm * 100) + '%';
            if (activeBgmElement) {
                activeBgmElement.volume = volumes.bgm;
            }
        });

        sfx1VolInput.addEventListener('input', (e) => {
            volumes.sfx1 = parseFloat(e.target.value);
            sfx1VolVal.textContent = Math.round(volumes.sfx1 * 100) + '%';
            customAudio.sfx1.volume = volumes.sfx1;
        });

        sfx2VolInput.addEventListener('input', (e) => {
            volumes.sfx2 = parseFloat(e.target.value);
            sfx2VolVal.textContent = Math.round(volumes.sfx2 * 100) + '%';
            customAudio.sfx2.volume = volumes.sfx2;
        });

        // Format Seconds -> MM:SS
        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Synthesized Audio Generators
        function playSynthSfx1() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.25 * volumes.sfx1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                gain.connect(ctx.destination);

                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1318.51, now); // E6
                osc1.frequency.setValueAtTime(1760.00, now + 0.15); // A6
                osc1.connect(gain);
                osc1.start(now);
                osc1.stop(now + 1.2);
            } catch (e) {
                console.error(e);
            }
        }

        function playSynthSfx2() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.3 * volumes.sfx2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                gain.connect(ctx.destination);

                const notes = [1046.50, 1567.98, 2093.00]; // C6, G6, C7
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.1));
                    osc.connect(gain);
                    osc.start(now + (idx * 0.1));
                    osc.stop(now + 1.5);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function startSynthBgm(type) {
            stopSynthBgm();
            const ctx = getAudioContext();
            const freqPattern = type === 1 ? [261.63, 329.63, 392.00, 523.25] : [220.00, 277.18, 329.63, 440.00];
            let noteIdx = 0;

            synthBgmInterval = setInterval(() => {
                if (volumes.bgm <= 0) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqPattern[noteIdx % freqPattern.length], now);
                
                gain.gain.setValueAtTime(0.08 * volumes.bgm, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.6);
                noteIdx++;
            }, 500);
        }

        function stopSynthBgm() {
            if (synthBgmInterval) {
                clearInterval(synthBgmInterval);
                synthBgmInterval = null;
            }
        }

        // Sound Player Functions
        function playBgm(mode) {
            stopAllAudio();
            getAudioContext();

            const isMode1 = (mode === 1);
            const audioElem = isMode1 ? customAudio.bgm1 : customAudio.bgm2;
            const hasCustom = isMode1 ? customFiles.bgm1 : customFiles.bgm2;

            if (hasCustom) {
                activeBgmElement = audioElem;
                activeBgmElement.volume = volumes.bgm;
                activeBgmElement.currentTime = 0;
                activeBgmElement.play().catch(err => console.log('Autoplay prevented:', err));
            } else {
                startSynthBgm(isMode1 ? 1 : 2);
            }
        }

        function triggerSfx(type) {
            if (type === 1) {
                if (customFiles.sfx1) {
                    customAudio.sfx1.volume = volumes.sfx1;
                    customAudio.sfx1.currentTime = 0;
                    customAudio.sfx1.play();
                } else {
                    playSynthSfx1();
                }
            } else if (type === 2) {
                if (customFiles.sfx2) {
                    customAudio.sfx2.volume = volumes.sfx2;
                    customAudio.sfx2.currentTime = 0;
                    customAudio.sfx2.play();
                } else {
                    playSynthSfx2();
                }
            }
        }

        function stopAllAudio() {
            Object.values(customAudio).forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
            stopSynthBgm();
            activeBgmElement = null;
        }

        // Mode Controller
        function selectMode(mode) {
            currentMode = mode;
            timerSeconds = 0;
            
            // Update UI Button Styles
            modeButtons.forEach((btn, index) => {
                if (index + 1 === mode) {
                    btn.classList.add('border-cyan-400', 'bg-slate-800', 'shadow-cyan-500/20');
                    btn.classList.remove('border-slate-700', 'bg-slate-900');
                } else {
                    btn.classList.remove('border-cyan-400', 'bg-slate-800', 'shadow-cyan-500/20');
                    btn.classList.add('border-slate-700', 'bg-slate-900');
                }
            });

            // Start BGM & Reset Timer
            playBgm(mode);
            startTimer();
            updateDisplay();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timerSeconds++;
                checkCycleEvents();
                updateDisplay();
            }, 1000);
        }

        function resetTimerCycle() {
            timerSeconds = 0;
            updateDisplay();
        }

        function checkCycleEvents() {
            if (currentMode === 3) {
                // 5分 (300秒) サイクル
                const cycleTime = timerSeconds % 300;
                if (cycleTime === 240) { // 4分経過
                    triggerSfx(1);
                } else if (cycleTime === 290) { // 4分50秒経過
                    triggerSfx(2);
                }
            } else if (currentMode === 4) {
                // 7分 (420秒) サイクル
                const cycleTime = timerSeconds % 420;
                if (cycleTime === 360) { // 6分経過
                    triggerSfx(1);
                } else if (cycleTime === 410) { // 6分50秒経過
                    triggerSfx(2);
                }
            }
        }

        function updateDisplay() {
            if (!currentMode) {
                activeModeTitle.textContent = "モードが選択されていません";
                timeDisplay.textContent = "00:00";
                cycleInfo.textContent = "ボタンを押してモードを選択してください";
                return;
            }

            const modeLabels = ["モードⅠ (通常A)", "モードⅡ (通常B)", "モードⅢ (5分サイクル)", "モードⅣ (7分サイクル)"];
            activeModeTitle.textContent = modeLabels[currentMode - 1];

            if (currentMode === 1 || currentMode === 2) {
                timeDisplay.textContent = formatTime(timerSeconds);
                cycleInfo.textContent = "ループ再生中";
            } else if (currentMode === 3) {
                const totalCycle = 300;
                const currentCycleSec = timerSeconds % totalCycle;
                const remainingSec = totalCycle - currentCycleSec;
                timeDisplay.textContent = formatTime(remainingSec);
                
                const cycleNum = Math.floor(timerSeconds / totalCycle) + 1;
                cycleInfo.textContent = `サイクル #${cycleNum} (4分:効果音1 / 4分50秒:効果音2)`;
            } else if (currentMode === 4) {
                const totalCycle = 420;
                const currentCycleSec = timerSeconds % totalCycle;
                const remainingSec = totalCycle - currentCycleSec;
                timeDisplay.textContent = formatTime(remainingSec);

                const cycleNum = Math.floor(timerSeconds / totalCycle) + 1;
                cycleInfo.textContent = `サイクル #${cycleNum} (6分:効果音1 / 6分50秒:効果音2)`;
            }
        }

        // Event Listeners for Mode Buttons
        modeButtons.forEach((btn, idx) => {
            btn.addEventListener('click', () => selectMode(idx + 1));
        });

        stopBtn.addEventListener('click', () => {
            currentMode = null;
            if (timerInterval) clearInterval(timerInterval);
            stopAllAudio();
            modeButtons.forEach(btn => {
                btn.classList.remove('border-cyan-400', 'bg-slate-800', 'shadow-cyan-500/20');
                btn.classList.add('border-slate-700', 'bg-slate-900');
            });
            updateDisplay();
        });

        resetCycleBtn.addEventListener('click', () => {
            if (currentMode) {
                resetTimerCycle();
            }
        });
    </script>

</body></html>
